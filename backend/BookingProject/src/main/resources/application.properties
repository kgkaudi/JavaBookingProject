spring.application.name=BookingProject
spring.data.mongodb.database=JavaBookingProject

# Optionally load local, git-ignored settings (secrets, seed passwords).
# Values in this file override the ones below.
spring.config.import=optional:classpath:application-local.properties

# --- JWT (REQUIRED): set JWT_SECRET (env var or in application-local.properties), >= 32 chars, random ---
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# --- Demo data seeding (OFF by default). To enable locally, set in application-local.properties
#     or via env: SEED_ENABLED=true SEED_ADMIN_PASSWORD=... SEED_TEST_USER_PASSWORD=... ---
app.seed.enabled=${SEED_ENABLED:false}
app.seed.admin-password=${SEED_ADMIN_PASSWORD:}
app.seed.test-user-password=${SEED_TEST_USER_PASSWORD:}

# --- CORS: comma separated list of allowed frontend origins ---
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# --- Create the unique indexes declared on the entities (users.email, rooms.roomNumber) ---
spring.data.mongodb.auto-index-creation=true
