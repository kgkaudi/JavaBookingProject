spring.application.name=BookingProject
spring.data.mongodb.database=JavaBookingProject

# --- JWT (REQUIRED): set the JWT_SECRET environment variable (>= 32 chars, random) ---
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# --- Demo data seeding (OFF by default). To enable locally:
#     SEED_ENABLED=true SEED_ADMIN_PASSWORD=... SEED_TEST_USER_PASSWORD=... ---
app.seed.enabled=${SEED_ENABLED:false}
app.seed.admin-password=${SEED_ADMIN_PASSWORD:}
app.seed.test-user-password=${SEED_TEST_USER_PASSWORD:}
